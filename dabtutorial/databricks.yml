# This is a Declarative Automation Bundle definition for dabtutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabtutorial
  uuid: 19908a07-5546-4b62-92cb-ba3fecc45656

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-e40539f9-9ac2.cloud.databricks.com/
      root_path: /Workspace/Users/nematshahi.mahdi@gmail.com/dev

  prod:
    mode: production
    workspace:
      host: https://dbc-e40539f9-9ac2.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/nematshahi.mahdi@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nematshahi.mahdi@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
